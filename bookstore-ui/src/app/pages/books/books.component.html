<div class="books-page">

  <div class="container">

    <!-- HEADER -->

    <div class="page-header">

      <h1>{{ title }}</h1>

      <p class="result-count" *ngIf="!loading && !error">
        {{ filtered.length }} cuốn sách
      </p>

    </div>

    <!-- TOOLBAR (chỉ trang Tất cả sách) -->

    <div class="toolbar" *ngIf="mode === 'all' && !loading && !error">

      <div class="search-box">
        <input
          type="text"
          placeholder="Tìm theo tên sách, tác giả, thể loại..."
          [(ngModel)]="keyword"
          (input)="onSearchChange()"
        />
        <span class="search-icon">
          <lucide-icon name="search"></lucide-icon>
        </span>
      </div>

      <div class="sort-group">

        <span class="sort-label">Sắp xếp:</span>

        <button
          class="sort-btn"
          [class.active]="sortOrder === 'newest'"
          (click)="setSortOrder('newest')"
        >
          Mới nhất
        </button>

        <button
          class="sort-btn"
          [class.active]="sortOrder === 'bestselling'"
          (click)="setSortOrder('bestselling')"
        >
          Bán chạy
        </button>

        <button
          class="sort-btn"
          [class.active]="sortOrder === 'price-asc'"
          (click)="setSortOrder('price-asc')"
        >
          Giá tăng ↑
        </button>

        <button
          class="sort-btn"
          [class.active]="sortOrder === 'price-desc'"
          (click)="setSortOrder('price-desc')"
        >
          Giá giảm ↓
        </button>

      </div>

    </div>

    <!-- LOADING -->

    <div class="products-grid" *ngIf="loading">
      <div class="skeleton-card" *ngFor="let s of skeletonItems">
        <div class="skeleton-box skeleton-cover"></div>
        <div class="skeleton-box skeleton-line"></div>
        <div class="skeleton-box skeleton-line short"></div>
      </div>
    </div>

    <!-- ERROR -->

    <div class="load-error" *ngIf="!loading && error">
      <p>{{ error }}</p>
      <button class="retry-btn" (click)="retry()">Thử lại</button>
    </div>

    <!-- EMPTY -->

    <div class="state-block" *ngIf="!loading && !error && filtered.length === 0">
      <p>📚 Không tìm thấy cuốn sách nào.</p>
    </div>

    <!-- GRID -->

    <div class="products-grid" *ngIf="!loading && !error && filtered.length > 0">

      <div class="card-wrap" *ngFor="let product of pageItems; let i = index">

        <span class="badge badge-new" *ngIf="isNew(product)">
          MỚI
        </span>

        <span
          class="badge badge-rank"
          [class.rank-1]="rankOf(i) === 1"
          [class.rank-2]="rankOf(i) === 2"
          [class.rank-3]="rankOf(i) === 3"
          *ngIf="rankOf(i) > 0"
        >
          #{{ rankOf(i) }}
        </span>

        <app-product-card [product]="product"></app-product-card>

      </div>

    </div>

    <!-- PAGINATION -->

    <div class="pagination" *ngIf="!loading && !error && totalPages > 1">

      <button
        class="page-btn"
        [disabled]="currentPage === 1"
        (click)="goToPage(currentPage - 1)"
      >
        ‹
      </button>

      <button
        class="page-btn"
        *ngFor="let p of pages"
        [class.active]="p === currentPage"
        (click)="goToPage(p)"
      >
        {{ p }}
      </button>

      <button
        class="page-btn"
        [disabled]="currentPage === totalPages"
        (click)="goToPage(currentPage + 1)"
      >
        ›
      </button>

    </div>

  </div>

</div>
