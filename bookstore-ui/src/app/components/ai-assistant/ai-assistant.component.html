<!-- Nút tròn nổi kích hoạt Chat (FAB) -->
<button class="ai-chat-fab" (click)="toggleChat()" [class.active]="isOpen" title="Hỏi Trợ Lý AI">
  <div class="fab-pulse" *ngIf="!isOpen"></div>
  <svg *ngIf="!isOpen" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
    stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="fab-icon">
    <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
  </svg>
  <svg *ngIf="isOpen" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
    stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="fab-icon">
    <line x1="18" y1="6" x2="6" y2="18"></line>
    <line x1="6" y1="6" x2="18" y2="18"></line>
  </svg>
</button>

<!-- Khung cửa sổ chat nổi -->
<div class="ai-chat-window" [class.open]="isOpen">
  <!-- Đầu cửa sổ chat -->
  <div class="chat-header">
    <div class="ai-info">
      <div class="ai-avatar-header">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round" class="robot-icon">
          <rect x="3" y="11" width="18" height="10" rx="2"></rect>
          <circle cx="12" cy="5" r="2"></circle>
          <path d="M12 7v4"></path>
          <line x1="8" y1="16" x2="8" y2="16.01"></line>
          <line x1="16" y1="16" x2="16" y2="16.01"></line>
        </svg>
        <span class="online-indicator"></span>
      </div>
      <div class="ai-title-wrap">
        <h4 class="ai-title">Trợ Lý Văn Đức</h4>
        <span class="ai-status">Đang trực tuyến</span>
      </div>
    </div>
    <div class="header-actions">
      <button class="header-action-btn" (click)="clearChat()" title="Làm mới trò chuyện">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round" class="action-icon">
          <polyline points="1 4 1 10 7 10"></polyline>
          <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path>
        </svg>
      </button>
      <button class="close-btn" (click)="toggleChat()" title="Đóng">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round" class="close-icon">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>
  </div>

  <!-- Thân chứa tin nhắn -->
  <div class="chat-body" #scrollMe (click)="onChatClick($event)">
    <div *ngFor="let msg of messages" class="message-row" [class.user-row]="msg.isUser">
      <!-- Avatar AI -->
      <div class="message-avatar" *ngIf="!msg.isUser">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="10" rx="2"></rect>
          <circle cx="12" cy="5" r="2"></circle>
          <path d="M12 7v4"></path>
          <line x1="8" y1="16" x2="8" y2="16.01"></line>
          <line x1="16" y1="16" x2="16" y2="16.01"></line>
        </svg>
      </div>

      <!-- Bong bóng tin nhắn -->
      <div class="message-bubble" [class.user-bubble]="msg.isUser">
        <div class="message-content" *ngIf="!msg.isUser" [innerHTML]="msg.formattedText"></div>
        <div class="message-content" *ngIf="msg.isUser">{{ msg.text }}</div>
        <span class="message-time">{{ msg.timestamp | date:'HH:mm' }}</span>
      </div>
    </div>

    <!-- Bong bóng gõ chữ khi đang tải -->
    <div class="message-row" *ngIf="isLoading">
      <div class="message-avatar">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="10" rx="2"></rect>
          <circle cx="12" cy="5" r="2"></circle>
          <path d="M12 7v4"></path>
          <line x1="8" y1="16" x2="8" y2="16.01"></line>
          <line x1="16" y1="16" x2="16" y2="16.01"></line>
        </svg>
      </div>
      <div class="message-bubble typing-bubble">
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
      </div>
    </div>
  </div>

  <!-- Khu vực các gợi ý nhanh -->
  <div class="chat-suggestions" *ngIf="!isLoading">
    <button *ngFor="let suggestion of suggestions" class="suggestion-chip" (click)="selectSuggestion(suggestion)">
      {{ suggestion }}
    </button>
  </div>

  <!-- Ô nhập liệu tin nhắn -->
  <div class="chat-footer">
    <input type="text" [(ngModel)]="userInput" (keydown.enter)="sendMessage()"
      placeholder="Nhập câu hỏi hoặc tên sách cần tìm..." [disabled]="isLoading">
    <button class="send-btn" (click)="sendMessage()" [disabled]="!userInput.trim() || isLoading" title="Gửi">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round" class="send-icon">
        <line x1="22" y1="2" x2="11" y2="13"></line>
        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
      </svg>
    </button>
  </div>
</div>
