<ng-template #content let-c="close" let-d="dismiss">
    <div class="modal-header d-flex justify-content-between align-items-center">
        <h4 class="modal-title m-0 font-weight-bold">
            <i class="fas fa-user-edit text-primary mr-2"></i>Chỉnh sửa thông tin người dùng
        </h4>
        <button type="button" class="close" aria-label="Đóng" (click)="d()">
            <span aria-hidden="true">&times;</span>
        </button>
    </div>
    <div class="modal-body p-4">
        <form [formGroup]="postForm" class="row">
            <input type="hidden" formControlName='userId'>
            <input type="hidden" formControlName="status">
            <input type="hidden" formControlName="token">
            <div class="col-md-7">
                <div class="form-group mb-3">
                    <label for="name">Họ và tên <span class="text-danger">*</span></label>
                    <input type="text" id="name" [ngClass]="{'is-invalid':postForm.get('name')?.touched && postForm.get('name')?.invalid}" class="form-control" formControlName="name">
                    <small class="invalid-feedback">Tên không hợp lệ</small>
                </div>
                <div class="form-group mb-3">
                    <label for="email">Địa chỉ Email <span class="text-danger">*</span></label>
                    <input type="email" id="email" [ngClass]="{'is-invalid':postForm.get('email')?.touched && postForm.get('email')?.invalid}" class="form-control" formControlName="email">
                    <small class="invalid-feedback">Email không hợp lệ</small>
                </div>
                <div class="form-group mb-3">
                    <label for="password">Mật khẩu</label>
                    <input type="password" id="password" placeholder="Để trống nếu không đổi" [ngClass]="{'is-invalid':postForm.get('password')?.touched && postForm.get('password')?.invalid}" class="form-control" formControlName="password">
                    <small class="invalid-feedback">Mật khẩu không hợp lệ</small>
                </div>
                <div class="form-group mb-3">
                    <label for="address">Địa chỉ</label>
                    <input type="text" id="address" [ngClass]="{'is-invalid':postForm.get('address')?.touched && postForm.get('address')?.invalid}" class="form-control" formControlName="address">
                    <small class="invalid-feedback">Địa chỉ không hợp lệ</small>
                </div>
                <div class="form-row">
                    <div class="form-group col-md-7 mb-3">
                        <label for="phone">Số điện thoại</label>
                        <input type="text" id="phone" [ngClass]="{'is-invalid':postForm.get('phone')?.touched && postForm.get('phone')?.invalid}" class="form-control" formControlName="phone">
                        <small class="invalid-feedback">Số điện thoại không hợp lệ</small>
                    </div>
                    <div class="form-group col-md-5 mb-3">
                        <label for="gender">Giới tính</label>
                        <select class="custom-select" id="gender" name="gender" formControlName="gender">
                            <option value="true">Nam</option>
                            <option value="false">Nữ</option>
                        </select>
                    </div>
                </div>
            </div>
            <div class="col-md-5 text-center d-flex flex-column align-items-center justify-content-center border-left">
                <label class="font-weight-600 mb-2">Ảnh đại diện</label>
                <img [src]="image" 
                     (error)="$any($event.target).src='https://ui-avatars.com/api/?name=User&background=059669&color=fff'"
                     style="width: 120px; height: 120px; object-fit: cover; border-radius: 50%; box-shadow: 0 4px 10px rgba(0,0,0,0.1); border: 3px solid #059669;" 
                     class="mt-1 mb-3" alt="Avatar">
                <input type="file" id="editCustFile" hidden (change)="onFileSelect($event)">
                <label for="editCustFile" class="btn btn-outline-primary btn-sm m-0">
                    <i class="fas fa-camera mr-1"></i> Đổi ảnh
                </label>
            </div>
        </form>
    </div>
    <div class="modal-footer d-flex justify-content-between">
        <button type="button" class="btn btn-light" (click)="d()">Hủy</button>
        <button type="button" class="btn btn-primary px-4" [disabled]="postForm?.invalid" (click)="update()">
            <i class="fas fa-save mr-1"></i> Lưu thay đổi
        </button>
    </div>
</ng-template>

<button class="action-btn action-btn-edit" title="Chỉnh sửa người dùng" (click)="open(content)">
    <i class="fas fa-edit"></i>
</button>
