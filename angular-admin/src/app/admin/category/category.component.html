<div class="container-fluid">

    <!-- Page Heading -->
    <div class="d-flex align-items-center justify-content-between mb-4">
        <div>
            <h1 class="page-title">Quản lý thể loại</h1>
            <p class="page-subtitle mb-0">Danh sách các danh mục, thể loại sách trong cửa hàng</p>
        </div>
    </div>

    <!-- Content Row -->
    <div class="row">
        <div class="col-12">
            <div class="admin-card">
                <!-- Toolbar -->
                <div class="table-toolbar">
                    <div class="search-input-group">
                        <i class="fas fa-search"></i>
                        <input type="text" placeholder="Tìm kiếm thể loại..." (keyup)="search($event);" />
                    </div>
                    <div class="d-flex align-items-center" style="gap: 10px;">
                        <app-add-category (saveFinish)="finish()"></app-add-category>
                    </div>
                </div>

                <!-- Table -->
                <div class="table-responsive">
                    <table mat-table [dataSource]="listData" matSort class="mat-elevation-z8">
                        <ng-container matColumnDef="categoryId">
                            <th mat-header-cell *matHeaderCellDef mat-sort-header style="width: 15%;">Mã thể loại</th>
                            <td mat-cell *matCellDef="let row">
                                <span class="font-weight-bold text-muted">#{{row.categoryId}}</span>
                            </td>
                        </ng-container>

                        <ng-container matColumnDef="categoryName">
                            <th mat-header-cell *matHeaderCellDef mat-sort-header style="width: 65%;">Tên thể loại</th>
                            <td mat-cell *matCellDef="let row">
                                <span class="font-weight-bold text-dark">{{row.categoryName}}</span>
                            </td>
                        </ng-container>

                        <ng-container matColumnDef="view">
                            <th mat-header-cell *matHeaderCellDef style="width: 10%; text-align: center;">Sửa</th>
                            <td mat-cell *matCellDef="let row" style="text-align: center;">
                                <app-edit-category [id]='row.categoryId' (editFinish)="finish()"></app-edit-category>
                            </td>
                        </ng-container>

                        <ng-container matColumnDef="delete">
                            <th mat-header-cell *matHeaderCellDef style="width: 10%; text-align: center;">Xoá</th>
                            <td mat-cell *matCellDef="let row" style="text-align: center;">
                                <button class="action-btn action-btn-delete" title="Xoá thể loại" (click)="delete(row.categoryId, row.categoryName)">
                                    <i class="fas fa-trash-alt"></i>
                                </button>
                            </td>
                        </ng-container>

                        <tr mat-header-row *matHeaderRowDef="columns"></tr>
                        <tr mat-row *matRowDef="let row; columns: columns;"></tr>
                    </table>
                </div>

                <!-- Paginator -->
                <mat-paginator [length]="categoriesLength" [pageSize]="10" showFirstLastButtons [pageSizeOptions]="[10, 25, 50, 100]">
                </mat-paginator>
            </div>
        </div>
    </div>
</div>
