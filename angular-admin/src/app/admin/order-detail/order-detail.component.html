<ng-template #content let-c="close" let-d="dismiss">
    <div class="modal-header d-flex justify-content-between align-items-center">
        <div>
            <h4 class="modal-title m-0 font-weight-bold">
                <i class="fas fa-file-invoice text-primary mr-2"></i>Chi tiết đơn hàng #{{order?.ordersId}}
            </h4>
            <div class="small text-muted mt-1" *ngIf="order">
                Khách hàng: <strong>{{order.user?.name}}</strong> | SĐT: <strong>{{order.phone}}</strong>
            </div>
        </div>
        <button type="button" class="close" aria-label="Đóng" (click)="d()">
            <span aria-hidden="true">&times;</span>
        </button>
    </div>

    <div class="modal-body p-0">
        <!-- Order Summary Bar -->
        <div class="p-3 bg-light border-bottom d-flex justify-content-between align-items-center flex-wrap">
            <div>
                <span class="text-muted small">Địa chỉ:</span> 
                <span class="font-weight-500 ml-1 small">{{order?.address}}</span>
            </div>
            <div>
                <span class="text-muted small mr-2">Tổng thanh toán:</span>
                <span class="h5 m-0 font-weight-bold text-primary">{{order?.amount|currency:'VND'}}</span>
            </div>
        </div>

        <div class="table-responsive">
            <table mat-table [dataSource]="listData" matSort class="mat-table w-100">
                <ng-container matColumnDef="index">
                    <th mat-header-cell *matHeaderCellDef style="width: 50px;">STT</th>
                    <td mat-cell *matCellDef="let row, let i = index">{{i+1}}</td>
                </ng-container>

                <ng-container matColumnDef="image">
                    <th mat-header-cell *matHeaderCellDef style="width: 60px;">Ảnh</th>
                    <td mat-cell *matCellDef="let row">
                        <img [src]="row.product?.image" class="book-cover-thumb" 
                             (error)="$any($event.target).src='data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%2244%22 height=%2260%22 fill=%22%23f1f5f9%22><rect width=%2244%22 height=%2260%22 rx=%224%22/><text x=%2250%%22 y=%2250%%22 dominant-baseline=%22middle%22 text-anchor=%22middle%22 fill=%22%2394a3b8%22 font-size=%2210%22>Sách</text></svg>'">
                    </td>
                </ng-container>

                <ng-container matColumnDef="product">
                    <th mat-header-cell *matHeaderCellDef>Tên sách</th>
                    <td mat-cell *matCellDef="let row">
                        <span class="font-weight-bold text-dark">{{row.product?.name}}</span>
                    </td>
                </ng-container>

                <ng-container matColumnDef="quantity">
                    <th mat-header-cell *matHeaderCellDef style="width: 90px; text-align: center;">SL</th>
                    <td mat-cell *matCellDef="let row" style="text-align: center;">
                        <span class="badge badge-light border px-2 py-1 font-weight-bold">{{row.quantity}}</span>
                    </td>
                </ng-container>

                <ng-container matColumnDef="price">
                    <th mat-header-cell *matHeaderCellDef style="width: 130px;">Đơn giá</th>
                    <td mat-cell *matCellDef="let row">
                        <span class="font-weight-bold text-dark">{{row.price|currency:'VND'}}</span>
                    </td>
                </ng-container>

                <tr mat-header-row *matHeaderRowDef="columns"></tr>
                <tr mat-row *matRowDef="let row; columns: columns;"></tr>
            </table>
        </div>
    </div>

    <div class="modal-footer d-flex justify-content-between">
        <button type="button" class="btn btn-light" (click)="d()">Đóng</button>
        <div class="d-flex" style="gap: 8px;" *ngIf="order">
            <button class="btn btn-success px-3" *ngIf="order.status==0" (click)="deliver()">
                <i class="fas fa-check mr-1"></i> Xác nhận giao hàng
            </button>
            <button class="btn btn-outline-danger px-3" *ngIf="order.status==0" (click)="cancel()">
                <i class="fas fa-times mr-1"></i> Huỷ đơn hàng
            </button>
            <button class="btn btn-primary px-3" *ngIf="order.status==1" (click)="confirm()">
                <i class="fas fa-money-check-alt mr-1"></i> Đã Thanh Toán & Giao Xong
            </button>
        </div>
    </div>
</ng-template>

<button class="action-btn action-btn-check" title="Xem chi tiết đơn hàng" (click)="open(content)">
    <i class="fas fa-clipboard-check"></i>
</button>
