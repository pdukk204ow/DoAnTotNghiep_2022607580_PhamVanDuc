<div class="container-fluid">

    <!-- Page Heading -->
    <div class="d-flex align-items-center justify-content-between mb-4">
        <div>
            <h1 class="page-title">Doanh thu theo thể loại</h1>
            <p class="page-subtitle mb-0">Thống kê số lượng sách bán ra và tổng thu nhập theo từng thể loại</p>
        </div>
    </div>

    <!-- Content Row -->
    <div class="row">
        <!-- Bảng thống kê -->
        <div class="col-lg-6 mb-4">
            <div class="admin-card h-100">
                <div class="admin-card-header">
                    <h2 class="admin-card-title">
                        <i class="fas fa-chart-pie text-primary mr-1"></i> Bảng doanh thu thể loại
                    </h2>
                </div>

                <div class="table-responsive table-scroll-container">
                    <table mat-table [dataSource]="listData" matSort class="mat-elevation-z8">
                        <ng-container matColumnDef="index">
                            <th mat-header-cell *matHeaderCellDef mat-sort-header style="width: 60px;">STT</th>
                            <td mat-cell *matCellDef="let row, let i = index">{{i+1}}</td>
                        </ng-container>

                        <ng-container matColumnDef="name">
                            <th mat-header-cell *matHeaderCellDef mat-sort-header style="min-width: 140px;">Tên loại hàng</th>
                            <td mat-cell *matCellDef="let row">
                                <span class="font-weight-bold text-dark">{{row.name}}</span>
                            </td>
                        </ng-container>

                        <ng-container matColumnDef="count">
                            <th mat-header-cell *matHeaderCellDef mat-sort-header style="width: 120px; text-align: center;">Đã bán</th>
                            <td mat-cell *matCellDef="let row" style="text-align: center;">
                                <span class="badge badge-soft-primary px-2 py-1 font-weight-bold">{{row.count}} cuốn</span>
                            </td>
                        </ng-container>

                        <ng-container matColumnDef="amount">
                            <th mat-header-cell *matHeaderCellDef mat-sort-header style="width: 140px;">Tổng thu nhập</th>
                            <td mat-cell *matCellDef="let row">
                                <span class="font-weight-bold text-primary">{{row.amount|currency:'VND'}}</span>
                            </td>
                        </ng-container>

                        <tr mat-header-row *matHeaderRowDef="columns"></tr>
                        <tr mat-row *matRowDef="let row; columns: columns;"></tr>
                    </table>
                </div>

                <mat-paginator [length]="lengthCategoryBestSeller" showFirstLastButtons [pageSize]="5" [pageSizeOptions]="[5, 10, 20]">
                </mat-paginator>
            </div>
        </div>

        <!-- Biểu đồ -->
        <div class="col-lg-6 mb-4">
            <div class="admin-card h-100 sticky-chart-card">
                <div class="admin-card-header">
                    <h2 class="admin-card-title">
                        <i class="fas fa-chart-donut text-primary mr-1"></i> Phân bổ doanh thu thể loại
                    </h2>
                </div>
                <div class="admin-card-body d-flex align-items-center justify-content-center">
                    <div id="divChart" style="width: 100%; min-height: 320px;">
                        <canvas id="charCategory"></canvas>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
